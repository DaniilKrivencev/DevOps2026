---
# official — репозиторий download.docker.com; distro — пакеты дистрибутива (docker.io)
docker_package_source: official
docker_official_packages: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
docker_distro_packages: [docker.io, docker-compose-v2]
docker_log_max_size: 10m
docker_log_max_file: 3
# пусто — драйвер по умолчанию (overlay2)
docker_storage_driver: ""
