---
# Docker Engine + Compose plugin.
- name: Ключ репозитория Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  when: docker_package_source == 'official'

- name: Репозиторий Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"]
    signed_by: /etc/apt/keyrings/docker.asc
  when: docker_package_source == 'official'
  register: docker_repo

- name: Пакеты Docker
  ansible.builtin.apt:
    name: "{{ docker_official_packages if docker_package_source == 'official' else docker_distro_packages }}"
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Каталог настроек Docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Настройки демона (ротация журналов, live-restore, no-new-privileges)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустить docker

- name: Docker запущен и в автозагрузке
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  # в режиме --check на чистой машине пакет ещё не установлен
  ignore_errors: "{{ ansible_check_mode }}"

- name: Применить настройки демона до запуска приложения
  ansible.builtin.meta: flush_handlers
