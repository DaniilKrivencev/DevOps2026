---
# SSH: вход только по ключам, root запрещён, разрешены только перечисленные пользователи.
- name: Пакет OpenSSH
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Настройки sshd (шаблон, проверка sshd -t перед применением)
  ansible.builtin.template:
    src: sshd-cityduma.conf.j2
    dest: /etc/ssh/sshd_config.d/10-cityduma.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Перезапустить ssh

- name: Служба ssh запущена и в автозагрузке
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
