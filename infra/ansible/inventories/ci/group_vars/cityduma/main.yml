---
# ── Параметры ОКРУЖЕНИЯ ci (проверочный стенд) ──
env_name: ci
app_tag: "0.6.2"
log_level: INFO
log_format: text
auto_rollback: 1
ssh_allowed_from: 0.0.0.0/0
# в контейнере hostname задаёт Docker
base_manage_hostname: false

# секреты стенда не хранятся вовсе: test/clean_machine.sh генерирует случайные
# значения vault_* при каждом запуске (test/.work/ci-secrets.yml, вне Git)
postgres_password: "{{ vault_postgres_password }}"
app_admin_password: "{{ vault_app_admin_password }}"
app_secretary_password: "{{ vault_app_secretary_password }}"
registry_username: "{{ vault_registry_username }}"
registry_password: "{{ vault_registry_password }}"
admin_ssh_pubkeys: "{{ vault_admin_ssh_pubkeys }}"
deploy_ssh_pubkey: "{{ vault_deploy_ssh_pubkey }}"
