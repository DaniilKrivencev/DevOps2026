# Конфигурация Ansible (ЛР7). Запуск — из каталога infra/ansible (make infra-*).
[defaults]
inventory = inventories/staging/hosts.yml
roles_path = roles
stdout_callback = default
callback_result_format = yaml
display_skipped_hosts = false
interpreter_python = auto_silent
forks = 10
# ключи хостов: новые принимаются один раз, изменившиеся — ошибка (защита от подмены сервера)
host_key_checking = True
retry_files_enabled = false
nocows = 1

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_cityduma

[privilege_escalation]
become = True
become_method = sudo
