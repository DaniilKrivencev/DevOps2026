# =============================================================================
# CI pipeline «Городская Дума» (ЛР5)
#
#   guard ─┐  (критические файлы, запрет удаления тестов)
#   style ─┤
#   test ──┤
#   migrations ─┤
#   backup ─────┼──────────────► publish (только push в main / тег v*)
#   security ───┤
#   build ─► container ┘
#
# Каждый этап — отдельный job в Docker-in-Docker (.github/workflows/ci-stage.yml),
# выполняющий scripts/ci.sh <этап> — те же команды, что `make ci-<этап>` локально.
# Публикация образа невозможна, если упал любой обязательный этап (needs).
# =============================================================================
name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: "0. Защита файлов приёмки"
    uses: ./.github/workflows/ci-stage.yml
    with:
      stage: guard
      fetch-depth: 0
      # PR — сравнение с целевой веткой; push — с предыдущим состоянием ветки
      guard-base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      allow-test-removal: ${{ contains(github.event.pull_request.labels.*.name, 'allow-test-removal') }}

  style:
    name: "1. Стиль"
    uses: ./.github/workflows/ci-stage.yml
    with: {stage: style}

  test:
    name: "2. Тесты"
    uses: ./.github/workflows/ci-stage.yml
    with: {stage: test}

  migrations:
    name: "3. Миграции"
    uses: ./.github/workflows/ci-stage.yml
    with: {stage: migrations}

  backup:
    name: "4. Резервное копирование"
    uses: ./.github/workflows/ci-stage.yml
    with: {stage: backup}

  security:
    name: "5. Безопасность"
    uses: ./.github/workflows/ci-stage.yml
    with: {stage: security, fetch-depth: 0}

  build:
    name: "6. Сборка образа"
    uses: ./.github/workflows/ci-stage.yml
    with: {stage: build}

  container:
    name: "7. Контейнерная проверка"
    needs: build
    uses: ./.github/workflows/ci-stage.yml
    with: {stage: container, needs-image: true}

  publish:
    name: "8. Публикация"
    needs: [guard, style, test, migrations, backup, security, container]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-stage.yml
    with: {stage: publish, needs-image: true, publish: true}
    secrets: inherit
