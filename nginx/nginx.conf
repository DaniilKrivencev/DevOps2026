# Nginx — единственная точка входа (ЛР4, дополнительное задание).
# Образ nginx-unprivileged: процесс не от root, слушает 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr "$request" $status upstream=$upstream_addr '
                    'instance=$upstream_http_x_instance_id rt=$request_time';
    access_log /dev/stdout main;

    # ограничение частоты запросов: 20 запросов/с с одного адреса, всплеск до 40
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    upstream cityduma {
        # round-robin между экземплярами; после 2 ошибок подряд экземпляр
        # исключается на 10 с (пассивная проверка)
        server app1:8000 max_fails=2 fail_timeout=10s;
        server app2:8000 max_fails=2 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=api burst=40 nodelay;

            proxy_pass http://cityduma;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            # повтор запроса на другом экземпляре при отказе (только идемпотентные)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
